# Runs the API and the MLflow dashboard together
#   docker compose up --build
#
#   API:     http://localhost:8000/docs
#   MLflow:  http://localhost:5000   (every Optuna trial and final training run)
#
# mlflow.db comes from the Colab training run (outputs.zip) and must be in the project folder.

services:
  api:
    build: .
    image: camtrap-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --host 0.0.0.0 --port 5000
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
    ports:
      - "5000:5000"
    restart: unless-stopped
