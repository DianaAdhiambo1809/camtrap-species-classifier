# Single source of truth for the pipeline. Every script reads this file,
# so a reviewer can reproduce results by changing nothing but this config.

seed: 42

paths:
  raw: data/raw            # downloaded metadata
  images: data/images      # resized image sample
  processed: data/processed  # split manifests (train/val/test CSVs)
  models: models
  reports: reports

data:
  image_size: 224          # images are resized at download time to save disk
  seasons: ["S01"]         # which seasons' labels to download; Season 1 is enough to start
  valid_dates:             # dates outside these ranges are camera clock errors
    S1: ["2010-07-01", "2010-11-30"]
  night_hours: [19, 6]     # night = 19:00 to 05:59 (the Serengeti is close to the equator)

# Which species become classes (rules from the data audit, Step 12)
classes:
  min_bursts: 300              # a species needs at least this many bursts,
  min_regular_cameras: 10      # seen regularly at this many cameras,
  regular_camera_bursts: 5     # where "regularly" means 5 or more bursts at that camera
  group_labels: [otherbird, reptiles, rodents, insectspider]   # cover several species, so go to "other"

# Whole cameras go to one split, so test cameras are never seen in training
split:
  val_share: 0.15          # share of the animal bursts given to validation cameras
  test_share: 0.15         # share of the animal bursts given to test cameras
  min_class_bursts: 20     # every class needs at least this many bursts in validation and in test
  max_tries: 200           # camera orders to try before giving up

# The photos to download: one photo (the middle one) per burst
sample:
  per_class: {train: 450, val: 100, test: 100}   # bursts per class in each split (fewer if not available)
  per_camera_per_class: 40                       # stops a few busy cameras from dominating
  image_base_url: "https://storage.googleapis.com/public-datasets-lila/snapshotserengeti-unzipped"
  download_workers: 16     # photos downloaded at the same time

# Logistic regression on pretrained features
baseline:
  C_values: [0.001, 0.01, 0.1, 1.0]   # regularisation strengths tried (smaller = stronger)

# CNN training with Optuna (run on Colab)
train:
  batch_size: 32
  trial_epochs: 6                         # epochs per Optuna trial (kept short to fit the GPU time)
  max_epochs: 15                          # final retrain of the best settings; early stopping usually ends it sooner
  patience: 3                             # early stopping: epochs without improvement before stopping
  n_trials: {scratch: 10, pretrained: 12}
  quality_gate_macro_f1: 0.50             # a model below this validation macro-F1 is not used by the API
  mlflow_experiment: camtrap-cnn
  mlflow_tracking_uri: "sqlite:///mlflow.db"

# Evaluation on the test cameras
evaluation:
  review_cost: 1           # cost of a person checking one photo
  error_cost: 5            # cost of a wrong label entering the database unchecked
  bootstrap_rounds: 1000   # resamples of the test cameras for the confidence interval

# Grad-CAM and the check of the text strip (brand, date, time) at the bottom of every photo
gradcam:
  strip_rows: 15           # height of the strip in a 224 x 224 photo (measured on 60 photos)
