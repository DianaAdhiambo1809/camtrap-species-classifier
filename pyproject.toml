[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "camtrap"
version = "0.1.0"
description = "Site-robust camera-trap species classification for East African wildlife"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]   # code errors, unused imports/variables, basic style

[tool.pytest.ini_options]
testpaths = ["tests"]
